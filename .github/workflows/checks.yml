name: Deterministic checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      qualify_large:
        description: Run model-free Linux qualification for all four large-project cases
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.7'
      - run: uv sync --frozen --group dev
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: python3 install.py check
      - run: git diff --check
  qualify-large:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.qualify_large) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/codex/large-project-cloud-handoff' &&
       contains(github.event.head_commit.message, '[qualify-large]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Qualify the existing runner without model calls
        run: python .github/scripts/qualify_large_projects.py
      - name: Retain sanitized qualification receipts, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: large-project-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/large-project-qualification/evidence/
          if-no-files-found: error
          retention-days: 14
