[project]
name = "agent-toolkit"
version = "0.1.0"
description = "Rory's reusable agents and skills"
requires-python = ">=3.11"

[dependency-groups]
dev = ["ruff>=0.15,<0.16", "mypy>=1.15,<2", "PyYAML>=6,<7"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["skills/doc-agent/evals/draft/roster.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["benchmarks", "install.py", "skills/doc-agent/scripts/check_environment.py", "skills/ddia-specialist/scripts/book.py", "skills/software-design-specialist/scripts/book.py"]
